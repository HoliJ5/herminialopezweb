<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Página no encontrada | Herminia López</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="fuentes.css">
    <link rel="stylesheet" href="estilos.css">
    <script>
        // Si la dirección es una de las páginas del sitio escrita de otra forma (/portfolio/, /Portfolio,
        // /contacto.html/...), GitHub Pages da 404. En vez de mostrar el error, se lleva a la página correcta.
        (function () {
            const paginas = ['portfolio', 'stock', 'sobremi', 'contacto', 'preguntasFrecuentes',
                             'aviso-legal', 'politica-privacidad', 'terminos-condiciones'];
            const limpia = location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html$/i, '');
            const destino = paginas.find((p) => p.toLowerCase() === limpia.toLowerCase());
            if (destino) location.replace('/' + destino + location.search + location.hash);
        })();
    </script>
    <style>
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }

        .titulo-fluido {
            font-size: clamp(1.75rem, 4vw, 2.5rem);
        }
        .numero-404 {
            font-size: clamp(4.5rem, 16vw, 8rem);
            line-height: 1;
        }
    </style>
</head>
<body class="opacity-0 transition-opacity duration-500 ease-in-out bg-[#fafafa] text-[#1c1c1c] font-sans antialiased flex flex-col min-h-screen text-base">

    <div id="nav-placeholder"></div>

    <main class="flex-grow w-full">
        <section class="bg-white py-12 md:py-16 px-4 sm:px-6">
            <div class="max-w-xl mx-auto text-center">
                <p class="font-serif numero-404 text-neutral-300 mb-4" aria-hidden="true">404</p>
                <h1 class="font-serif titulo-fluido font-normal mb-4 text-neutral-900">Esta página no existe</h1>
                <p class="text-neutral-600 font-light text-sm sm:text-base leading-relaxed mb-8">
                    Puede que el enlace esté roto o que la dirección que buscas ya no esté disponible. Prueba con alguna de estas opciones:
                </p>
                <div class="flex flex-col md:flex-row items-center justify-center gap-4">
                    <a href="./" class="inline-block bg-[#726260] text-white px-6 py-3 sm:px-8 sm:py-3.5 uppercase tracking-widest text-[10px] sm:text-xs font-semibold hover:bg-[#827a79] transition-colors">Volver al inicio</a>
                    <a href="portfolio" class="inline-block bg-[#726260] text-white px-6 py-3 sm:px-8 sm:py-3.5 uppercase tracking-widest text-[10px] sm:text-xs font-semibold hover:bg-[#827a79] transition-colors">Ver el portfolio</a>
                    <a href="contacto" class="inline-block bg-[#726260] text-white px-6 py-3 sm:px-8 sm:py-3.5 uppercase tracking-widest text-[10px] sm:text-xs font-semibold hover:bg-[#827a79] transition-colors">Contactar</a>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder" class="mt-auto"></div>

    <script src="componentes.js"></script>
</body>
</html>
