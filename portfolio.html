<body class="opacity-0 transition-opacity duration-500 ease-in-out bg-[#fafafa] text-[#1c1c1c] font-sans antialiased flex flex-col min-h-screen text-base">

        <h2 class="hidden md:block font-serif titulo-fluido font-normal mb-6 text-center">Portfolio</h2>
        
        <div class="hidden md:block">

        </div>

        <div id="info-subtipos-contenedor" class="mt-4 md:mt-8 flex flex-col gap-12 md:gap-20 empty:hidden border-b border-neutral-200 pb-12 mb-12 md:pb-16 md:mb-16"></div>

        <div id="galeria-contenedor" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8"></div>

    <div id="modal-obra" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center hidden" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">

        <button id="modal-prev" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 text-white/50 hover:text-white text-5xl sm:text-7xl font-light transition-colors z-50 hidden select-none" aria-label="Imagen anterior">&lsaquo;</button>
        <button id="modal-next" class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 text-white/50 hover:text-white text-5xl sm:text-7xl font-light transition-colors z-50 hidden select-none" aria-label="Siguiente imagen">&rsaquo;</button>

        <div class="relative max-w-4xl max-h-[95vh] w-full px-4 flex flex-col items-center justify-center overflow-y-auto py-6" id="modal-area-deslizable">
            
            <div id="slider-contenedor" class="w-full h-[50vh] sm:h-[60vh] overflow-hidden relative touch-pan-y">

            </div>
            
            <div id="modal-miniaturas" class="flex gap-2 sm:gap-3 mt-4 sm:mt-6 overflow-x-auto max-w-full pb-2 scrollbar-none"></div>

            <div id="modal-info" class="text-center text-white mt-4 max-w-xl px-2 flex flex-col items-center">
                <h3 id="modal-titulo" class="font-serif text-xl sm:text-2xl font-medium"></h3>
                <div id="modal-detalles" class="text-xs sm:text-sm text-neutral-300 mt-1 flex flex-col gap-1"></div>
                
                <a id="modal-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 mt-4 text-xs sm:text-sm font-medium text-white hover:text-[#25D366] bg-white/10 hover:bg-white/20 px-5 py-2 rounded-full transition-all duration-300 border border-white/20 hover:border-[#25D366]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                    </svg>
                    Solicitar presupuesto
                </a>
            </div>
            
        </div>
    </div>

    <script src="componentes.js"></script>
    <script>
        // Ruta de la miniatura: img/foto.webp -> img/thumbs/foto.webp
        // (las genera scripts/generar-miniaturas.py)
        const rutaMiniatura = (ruta) => ruta.replace(/^img\//, 'img/thumbs/');

        // Si una miniatura aún no existe, se muestra el original (una sola vez, sin bucles).
        document.addEventListener('error', (e) => {
            const img = e.target;
            if (img.tagName !== 'IMG' || !img.dataset.original || img.dataset.fallback) return;
            img.dataset.fallback = '1';
            img.src = img.dataset.original;
        }, true);

        document.addEventListener('DOMContentLoaded', () => {
            const contenedor = document.getElementById('galeria-contenedor');
            const modal = document.getElementById('modal-obra');
            
            const sliderContenedor = document.getElementById('slider-contenedor');
            const sliderTrack = document.getElementById('slider-track');
            
            const modalTitulo = document.getElementById('modal-titulo');
            const modalDetalles = document.getElementById('modal-detalles');
            const modalCerrar = document.getElementById('modal-cerrar');
            const modalMiniaturas = document.getElementById('modal-miniaturas');
            const modalWhatsapp = document.getElementById('modal-whatsapp');
            
            const btnPrev = document.getElementById('modal-prev');
            const btnNext = document.getElementById('modal-next');

            let obrasData = [];
            let infoData = [];
            const urlParams = new URLSearchParams(window.location.search);
            let filtroActual = urlParams.get('filtro') || 'todos';
            let subfiltroActual = urlParams.get('subfiltro') || 'todos';

            let imagenesModalActuales = [];
            let indiceModalActual = 0;
            
            let isDragging = false;
            let startX = 0;
            let currentX = 0;

            // ---------- Zoom táctil: pellizco, arrastre con la imagen ampliada y doble toque ----------
            const ZOOM_MAX = 5;
            const ZOOM_DOBLE_TOQUE = 2.5;
            let zoom = 1;
            let panX = 0;
            let panY = 0;
            let modoGesto = 'ninguno'; // 'ninguno' | 'swipe' | 'pellizco' | 'pan'
            let pellizco = null;
            let panPrev = { x: 0, y: 0 };
            let tapInicio = null;
            let ultimoTap = { t: 0, x: 0, y: 0 };

            function imagenActual() {
                const slide = sliderTrack.children[indiceModalActual];
                return slide ? slide.firstElementChild : null;
            }

            function limitar(v, min, max) {
                return Math.min(max, Math.max(min, v));
            }

            // Evita que la imagen ampliada se salga del marco más de lo necesario.
            function limitarPan() {
                const img = imagenActual();
                if (!img) { panX = 0; panY = 0; return; }
                const maxX = Math.max(0, (img.offsetWidth * zoom - sliderContenedor.clientWidth) / 2);
                const maxY = Math.max(0, (img.offsetHeight * zoom - sliderContenedor.clientHeight) / 2);
                panX = limitar(panX, -maxX, maxX);
                panY = limitar(panY, -maxY, maxY);
            }

            function aplicarZoom(animar) {
                const img = imagenActual();
                if (img) {
                    img.style.transition = animar ? 'transform 0.2s ease-out' : 'none';
                    img.style.transform = (zoom === 1 && panX === 0 && panY === 0)
                        ? ''
                        : `translate(${panX}px, ${panY}px) scale(${zoom})`;
                }
                // Con zoom, el dedo debe poder moverse en cualquier dirección sin que el navegador haga scroll.
                sliderContenedor.style.touchAction = zoom > 1 ? 'none' : '';
            }

            function resetZoom() {
                zoom = 1;
                panX = 0;
                panY = 0;
                sliderTrack.querySelectorAll('img').forEach(i => {
                    i.style.transition = '';
                    i.style.transform = '';
                });
                sliderContenedor.style.touchAction = '';
            }

            function alternarZoomEn(x, y) {
                if (!imagenActual()) return;
                if (zoom > 1) {
                    zoom = 1; panX = 0; panY = 0;
                } else {
                    const r = sliderContenedor.getBoundingClientRect();
                    zoom = ZOOM_DOBLE_TOQUE;
                    panX = -(zoom - 1) * (x - (r.left + r.width / 2));
                    panY = -(zoom - 1) * (y - (r.top + r.height / 2));
                    limitarPan();
                }
                aplicarZoom(true);
            }

            function distanciaToques(t) {
                return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
            }

            function centroToques(t) {
                return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 };
            }

            function toqueInicio(e) {
                if (e.touches.length === 2) {
                    // Un segundo dedo cancela cualquier deslizamiento de galería en curso.
                    if (isDragging) {
                        isDragging = false;
                        currentX = 0;
                        actualizarVistaModal();
                    }
                    const r = sliderContenedor.getBoundingClientRect();
                    const c = centroToques(e.touches);
                    const cx = r.left + r.width / 2;
                    const cy = r.top + r.height / 2;
                    modoGesto = 'pellizco';
                    tapInicio = null;
                    pellizco = {
                        dist: distanciaToques(e.touches) || 1,
                        zoom: zoom,
                        cx: cx,
                        cy: cy,
                        // Punto de la imagen (sin escalar) que queda bajo el centro del pellizco
                        px: (c.x - cx - panX) / zoom,
                        py: (c.y - cy - panY) / zoom
                    };
                    return;
                }

                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    tapInicio = { x: t.clientX, y: t.clientY, t: Date.now() };
                    if (zoom > 1) {
                        modoGesto = 'pan';
                        panPrev = { x: t.clientX, y: t.clientY };
                    } else {
                        modoGesto = 'swipe';
                        iniciarArrastre(e);
                    }
                }
            }

            function toqueMovimiento(e) {
                if (tapInicio && e.touches.length === 1) {
                    const t = e.touches[0];
                    if (Math.hypot(t.clientX - tapInicio.x, t.clientY - tapInicio.y) > 10) tapInicio = null;
                }

                if (modoGesto === 'pellizco') {
                    if (e.touches.length !== 2 || !pellizco) return;
                    e.preventDefault();
                    const c = centroToques(e.touches);
                    zoom = limitar(pellizco.zoom * distanciaToques(e.touches) / pellizco.dist, 1, ZOOM_MAX);
                    panX = c.x - pellizco.cx - zoom * pellizco.px;
                    panY = c.y - pellizco.cy - zoom * pellizco.py;
                    limitarPan();
                    aplicarZoom(false);
                } else if (modoGesto === 'pan') {
                    if (e.touches.length !== 1) return;
                    e.preventDefault();
                    const t = e.touches[0];
                    panX += t.clientX - panPrev.x;
                    panY += t.clientY - panPrev.y;
                    panPrev = { x: t.clientX, y: t.clientY };
                    limitarPan();
                    aplicarZoom(false);
                } else if (modoGesto === 'swipe') {
                    arrastrar(e);
                }
            }

            function toqueFin(e) {
                if (modoGesto === 'pellizco') {
                    if (e.touches.length < 2) {
                        if (zoom < 1.05) {
                            zoom = 1; panX = 0; panY = 0;
                            aplicarZoom(true);
                        } else {
                            limitarPan();
                            aplicarZoom(false);
                        }
                        if (e.touches.length === 1 && zoom > 1) {
                            // Queda un dedo: sigue moviendo la imagen ampliada
                            modoGesto = 'pan';
                            panPrev = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                        } else {
                            modoGesto = 'ninguno';
                        }
                        pellizco = null;
                    }
                    tapInicio = null;
                    return;
                }

                if (modoGesto === 'swipe') finalizarArrastre();

                if (e.touches.length === 0) {
                    modoGesto = 'ninguno';

                    // Doble toque: alterna entre zoom y vista normal
                    if (tapInicio && e.type === 'touchend' && e.changedTouches.length === 1) {
                        const ahora = Date.now();
                        const t = e.changedTouches[0];
                        if (ahora - tapInicio.t < 250) {
                            const esDoble = ahora - ultimoTap.t < 300 &&
                                Math.hypot(t.clientX - ultimoTap.x, t.clientY - ultimoTap.y) < 40;
                            if (esDoble) {
                                alternarZoomEn(t.clientX, t.clientY);
                                ultimoTap = { t: 0, x: 0, y: 0 };
                            } else {
                                ultimoTap = { t: ahora, x: t.clientX, y: t.clientY };
                            }
                        }
                    }
                    tapInicio = null;
                }
            }

            function actualizarMiniaturas() {
                Array.from(modalMiniaturas.children).forEach((thumb, index) => {
                    if (index === indiceModalActual) {
                        thumb.classList.remove('border-transparent', 'opacity-50', 'hover:opacity-100');
                        thumb.classList.add('border-white', 'opacity-100');
                    } else {
                        thumb.classList.add('border-transparent', 'opacity-50', 'hover:opacity-100');
                        thumb.classList.remove('border-white', 'opacity-100');
                    }
                });
            }

            // Asigna el src real solo a la imagen actual y a sus vecinas
            // (la navegación es circular, por eso se usa el módulo).
            function precargarSlides(centro) {
                const total = imagenesModalActuales.length;
                [centro, centro + 1, centro - 1].forEach(i => {
                    const slide = sliderTrack.children[(i + total) % total];
                    const img = slide && slide.firstElementChild;
                    if (img && !img.src) img.src = img.dataset.src;
                });
            }

            // Las miniaturas de la tira solo se descargan cuando entran en pantalla.
            let observadorMiniaturas = null;

            function activarCargaMiniaturas() {
                if (observadorMiniaturas) observadorMiniaturas.disconnect();
                observadorMiniaturas = new IntersectionObserver((entradas, obs) => {
                    entradas.forEach(entrada => {
                        if (!entrada.isIntersecting) return;
                        entrada.target.src = entrada.target.dataset.src;
                        obs.unobserve(entrada.target);
                    });
                }, { root: modalMiniaturas, rootMargin: '0px 150px' });
                modalMiniaturas.querySelectorAll('img[data-src]').forEach(t => observadorMiniaturas.observe(t));
            }

            function actualizarVistaModal() {
                resetZoom();
                sliderTrack.style.transition = 'transform 0.3s ease-out';
                sliderTrack.style.transform = `translateX(-${indiceModalActual * 100}%)`;
                precargarSlides(indiceModalActual);
                actualizarMiniaturas();
            }

            function cambiarImagenModal(direccion) {
                if (imagenesModalActuales.length <= 1) return;
                
                indiceModalActual += direccion;
                
                if (indiceModalActual >= imagenesModalActuales.length) indiceModalActual = 0;
                if (indiceModalActual < 0) indiceModalActual = imagenesModalActuales.length - 1;
                
                actualizarVistaModal();
            }

            function abrirModal(obra) {
                imagenesModalActuales = [obra.imagen];
                if (obra.imagenes && obra.imagenes.length > 0) {
                    imagenesModalActuales.push(...obra.imagenes);
                }
                indiceModalActual = 0;

                modalTitulo.textContent = obra.titulo;
                
                modalDetalles.innerHTML = obra.almacen === 1 && obra.precio !== undefined
                    ? `<div>${obra.subtitulo}</div>
                       <div>${obra.precio}€</div>`
                    : `<div>${obra.subtitulo}</div>`;
                
                const numeroWhatsApp = "34644241265";
                const textoMensaje = obra.almacen === 1 
                    ? `¡Hola! Me gustaría comprar / pedir información sobre "${obra.titulo}".` 
                    : `¡Hola! Me gustaría solicitar información sobre "${obra.tipo}", "${obra.subtipo}".`;
                const mensaje = encodeURIComponent(textoMensaje);
                
                modalWhatsapp.href = `https://wa.me/${numeroWhatsApp}?text=${mensaje}`;

                sliderTrack.innerHTML = '';
                
                imagenesModalActuales.forEach((imgSrc) => {
                    const slideWrapper = document.createElement('div');
                    slideWrapper.className = 'w-full h-full flex-shrink-0 px-2 sm:px-6 flex items-center justify-center';
                    
                    const img = document.createElement('img');
                    img.dataset.src = imgSrc;
                    img.alt = obra.titulo;
                    img.className = 'max-w-full max-h-full object-contain select-none pointer-events-none text-transparent';
                    
                    slideWrapper.appendChild(img);
                    sliderTrack.appendChild(slideWrapper);
                });

                modalMiniaturas.innerHTML = '';

                if (imagenesModalActuales.length > 1) {
                    btnPrev.classList.remove('hidden');
                    btnNext.classList.remove('hidden');
                } else {
                    btnPrev.classList.add('hidden');
                    btnNext.classList.add('hidden');
                }

                if (imagenesModalActuales.length > 1) {
                    imagenesModalActuales.forEach((imgSrc, index) => {
                        const thumb = document.createElement('img');
                        thumb.dataset.src = rutaMiniatura(imgSrc);
                        thumb.dataset.original = imgSrc;
                        thumb.decoding = 'async';
                        thumb.alt = `Vista ${index + 1} de ${obra.titulo}`;
                        thumb.className = 'w-12 h-12 sm:w-16 sm:h-16 flex-shrink-0 object-cover cursor-pointer border-2 transition-all duration-200 bg-white/10 text-transparent';
                        
                        thumb.addEventListener('click', () => {
                            indiceModalActual = index;
                            actualizarVistaModal();
                        });

                        modalMiniaturas.appendChild(thumb);
                    });
                }

                resetZoom();
                sliderTrack.style.transition = 'none';
                sliderTrack.style.transform = `translateX(0%)`;
                precargarSlides(0);
                actualizarMiniaturas();

                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                activarCargaMiniaturas();
            }

            function cerrarModal() {
                resetZoom();
                modoGesto = 'ninguno';
                if (observadorMiniaturas) observadorMiniaturas.disconnect();
                modal.classList.add('hidden');
                sliderTrack.innerHTML = '';
                modalMiniaturas.innerHTML = '';
                document.body.style.overflow = '';
            }

            btnPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                cambiarImagenModal(-1);
            });
            btnNext.addEventListener('click', (e) => {
                e.stopPropagation();
                cambiarImagenModal(1);
            });

            function iniciarArrastre(e) {
                if (imagenesModalActuales.length <= 1) return;
                isDragging = true;
                startX = e.touches[0].clientX;
                sliderTrack.style.transition = 'none'; 
            }

            function arrastrar(e) {
                if (!isDragging) return;
                e.preventDefault(); 
                currentX = e.touches[0].clientX - startX;
                
                if (indiceModalActual === 0 && currentX > 0) {
                    currentX = currentX * 0.3;
                } else if (indiceModalActual === imagenesModalActuales.length - 1 && currentX < 0) {
                    currentX = currentX * 0.3;
                }

                sliderTrack.style.transform = `translateX(calc(-${indiceModalActual * 100}% + ${currentX}px))`;
            }

            function finalizarArrastre() {
                if (!isDragging) return;
                isDragging = false;

                const umbralCambio = window.innerWidth * 0.15; 

                if (currentX <= -umbralCambio && indiceModalActual < imagenesModalActuales.length - 1) {
                    cambiarImagenModal(1); 
                } else if (currentX >= umbralCambio && indiceModalActual > 0) {
                    cambiarImagenModal(-1);
                } else {
                    actualizarVistaModal(); 
                }
                currentX = 0;
            }

            sliderContenedor.addEventListener('touchstart', toqueInicio, { passive: true });
            sliderContenedor.addEventListener('touchmove', toqueMovimiento, { passive: false });
            sliderContenedor.addEventListener('touchend', toqueFin);
            sliderContenedor.addEventListener('touchcancel', toqueFin);
            // Safari iOS: evita que el gesto de pellizco haga zoom de toda la página
            ['gesturestart', 'gesturechange'].forEach(ev =>
                sliderContenedor.addEventListener(ev, (e) => e.preventDefault())
            );

            function renderizarFiltrosPrincipales() {
                const contenedorFiltros = document.getElementById('filtros-contenedor');
                contenedorFiltros.innerHTML = '';

                const tiposUnicos = [...new Set(obrasData.flatMap(o => Array.isArray(o.tipo) ? o.tipo : [o.tipo]).filter(Boolean))];

                const btnTodos = document.createElement('button');
                btnTodos.textContent = 'Mostrar todos';
                btnTodos.className = `bg-transparent hover:text-[#4b262a] transition-colors py-1 ${filtroActual === 'todos' ? 'text-black font-semibold' : ''}`;
                btnTodos.addEventListener('click', () => {
                    filtroActual = 'todos';
                    subfiltroActual = 'todos';
                    renderizarFiltrosPrincipales(); 
                    renderizerSubfiltros();
                    aplicarFiltro();
                });
                contenedorFiltros.appendChild(btnTodos);

                tiposUnicos.forEach(tipo => {
                    const btn = document.createElement('button');
                    btn.textContent = tipo.charAt(0).toUpperCase() + tipo.slice(1);
                    btn.className = `bg-transparent hover:text-[#4b262a] transition-colors py-1 ${filtroActual === tipo ? 'text-black font-semibold' : ''}`;
                    
                    btn.addEventListener('click', () => {
                        filtroActual = tipo;
                        subfiltroActual = 'todos';
                        renderizarFiltrosPrincipales(); 
                        renderizerSubfiltros();
                        aplicarFiltro();
                    });
                    
                    contenedorFiltros.appendChild(btn);
                });
            }

            function renderizerSubfiltros() {
                const contenedorSub = document.getElementById('subfiltros-contenedor');
                contenedorSub.innerHTML = '';

                if (filtroActual === 'todos') {
                    contenedorSub.classList.add('hidden');
                    return;
                }

                const subtipos = [...new Set(obrasData
                    .filter(o => {
                        const esDelTipo = Array.isArray(o.tipo) ? o.tipo.includes(filtroActual) : o.tipo === filtroActual;
                        return esDelTipo && o.subtipo;
                    })
                    .map(o => o.subtipo)
                )];

                if (subtipos.length === 0) {
                    contenedorSub.classList.add('hidden');
                    return;
                }

                contenedorSub.classList.remove('hidden');

                const btnTodosSub = document.createElement('button');
                btnTodosSub.textContent = 'Todos';
                btnTodosSub.className = `bg-transparent hover:text-[#4b262a] transition-colors py-1 ${subfiltroActual === 'todos' ? 'text-black font-semibold' : ''}`;
                btnTodosSub.addEventListener('click', () => {
                    subfiltroActual = 'todos';
                    aplicarFiltro();
                    renderizerSubfiltros();
                });
                contenedorSub.appendChild(btnTodosSub);

                subtipos.forEach(sub => {
                    const btn = document.createElement('button');
                    btn.textContent = sub;
                    btn.className = `bg-transparent hover:text-[#4b262a] transition-colors py-1 ${subfiltroActual === sub ? 'text-black font-semibold' : ''}`;
                    btn.addEventListener('click', () => {
                        subfiltroActual = sub;
                        aplicarFiltro();
                        renderizerSubfiltros();
                    });
                    contenedorSub.appendChild(btn);
                });
            }

            function renderizarInfoSubtipos() {
                const contenedorInfo = document.getElementById('info-subtipos-contenedor');
                contenedorInfo.innerHTML = '';

                const infoFiltrada = infoData.filter(info => {
                    if (subfiltroActual !== 'todos') {
                        return info.subtipo === subfiltroActual;
                    } else {
                        return info.tipo && (filtroActual === 'todos' || info.tipo === filtroActual);
                    }
                });

                const isTodos = filtroActual === 'todos' && subfiltroActual === 'todos';
                
                if (isTodos) {
                    contenedorInfo.className = "mt-4 md:mt-8 flex flex-col gap-12 md:gap-20 empty:hidden border-b border-neutral-200 pb-12 mb-12 md:pb-16 md:mb-16";
                } else {
                    contenedorInfo.className = "mt-4 md:mt-8 flex flex-col empty:hidden border-b border-neutral-200 pb-6 mb-6 md:pb-16 md:mb-16";
                }

                const claseDescripcion = isTodos ? 'hidden md:block' : 'block';
                const claseCollage = isTodos ? 'grid' : 'hidden md:grid';
                const gapClase = isTodos ? 'gap-2' : 'gap-6';
                const mbTitulo = isTodos ? 'mb-0 md:mb-3' : 'mb-3';

                infoFiltrada.forEach((info, index) => {
                    const direccionFlex = index % 2 === 0 ? 'md:flex-row' : 'md:flex-row-reverse';
                    const tituloARenderizar = info.tipo ? info.tipo : info.subtipo;

                    const activarFiltro = () => {
                        if (info.tipo) {
                            filtroActual = info.tipo;
                            subfiltroActual = 'todos';
                        } else if (info.subtipo) {
                            subfiltroActual = info.subtipo;
                        }
                        renderizarFiltrosPrincipales();
                        renderizerSubfiltros();
                        aplicarFiltro();
                        
                        document.getElementById('filtros-contenedor').scrollIntoView({ behavior: 'smooth' });
                    };

                    const bloqueInfo = document.createElement('div');
                    bloqueInfo.className = `flex flex-col ${direccionFlex} ${gapClase} md:gap-12 items-center w-full`;
                    
                    const parrafos = Array.isArray(info.descripcion)
                        ? info.descripcion
                        : (typeof info.descripcion === 'string' ? info.descripcion.split(/\n\n+/) : []);

                    const descripcionHtml = parrafos.map((p, i) => 
                        `<p class="text-neutral-600 font-light text-sm sm:text-base leading-relaxed pointer-events-none ${claseDescripcion} ${i > 0 ? 'mt-3' : ''}">${formatearTexto(p)}</p>`
                    ).join('');

                    bloqueInfo.innerHTML = `
                        <div class="w-full md:w-1/2 flex flex-col justify-center text-left md:text-left cursor-pointer hover:bg-neutral-50 transition-colors p-1 md:p-4 rounded-sm" id="btn-info-${index}">
                            <h3 class="font-serif text-2xl sm:text-3xl font-medium ${mbTitulo} text-neutral-800">${tituloARenderizar}</h3>
                            ${descripcionHtml}
                        </div>
                    `;
                    
                    if (info.imagenes && info.imagenes.length > 0) {
                        const gridCols = info.imagenes.length === 1 ? 'grid-cols-1' : 'grid-cols-2';
                        const collageContenedor = document.createElement('div');
                        
                        collageContenedor.className = `w-full md:w-1/2 ${claseCollage} ${gridCols} gap-3 sm:gap-4`;

                        info.imagenes.forEach(rutaImagen => {
                            const obraVinculada = obrasData.find(o => o.imagen === rutaImagen);

                            const imgWrapper = document.createElement('div');
                            imgWrapper.className = `overflow-hidden bg-neutral-100 aspect-square rounded-sm ${obraVinculada ? 'cursor-pointer' : 'cursor-pointer md:cursor-default'} group`;
                            
                            const imgEl = document.createElement('img');
                            imgEl.loading = index === 0 ? 'eager' : 'lazy';
                            imgEl.decoding = 'async';
                            imgEl.dataset.original = rutaImagen;
                            imgEl.src = rutaMiniatura(rutaImagen);
                            imgEl.alt = `Ejemplo de ${tituloARenderizar}`;
                            imgEl.className = "w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105";
                            
                            imgWrapper.addEventListener('click', () => {
                                const esMovil = window.innerWidth < 768;
                                if (esMovil) {
                                    activarFiltro();
                                } else if (obraVinculada) {
                                    abrirModal(obraVinculada);
                                }
                            });
                            
                            imgWrapper.appendChild(imgEl);
                            collageContenedor.appendChild(imgWrapper);
                        });
                        bloqueInfo.appendChild(collageContenedor);
                    }
                    
                    contenedorInfo.appendChild(bloqueInfo);

                    const btnInfo = document.getElementById(`btn-info-${index}`);
                    if(btnInfo) {
                        btnInfo.addEventListener('click', activarFiltro);
                    }
                });
            }

            function formatearTexto(texto) {
                if (!texto) return '';
                return String(texto)
                    .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-neutral-900">$1</strong>')
                    .replace(/\n/g, '<br>');
            }

            function getColumnasGaleria() {
                if (window.innerWidth >= 1024) return 4;
                if (window.innerWidth >= 640) return 3;
                return 2;
            }

            function crearBloqueDescripcionPrecio(texto) {
                const bloque = document.createElement('div');
                bloque.className = 'col-span-full py-2 sm:py-3 px-4 text-center flex flex-col items-center justify-center';
                bloque.style.gridColumn = '1 / -1';

                const parrafos = Array.isArray(texto)
                    ? texto
                    : (typeof texto === 'string' ? texto.split(/\n\n+/) : []);

                const html = parrafos.map((p, i) => 
                    `<p class="text-neutral-600 font-light text-sm sm:text-base md:text-lg leading-relaxed ${i > 0 ? 'mt-2 sm:mt-3' : ''}">${formatearTexto(p)}</p>`
                ).join('');

                bloque.innerHTML = `
                    <div class="max-w-2xl mx-auto">
                        ${html}
                    </div>
                `;
                return bloque;
            }

            function aplicarFiltro() {
                contenedor.innerHTML = '';
                
                const filtradas = obrasData.filter(o => {
                    const cumpleTipo = filtroActual === 'todos' || (Array.isArray(o.tipo) ? o.tipo.includes(filtroActual) : o.tipo === filtroActual);
                    const cumpleSubtipo = subfiltroActual === 'todos' || o.subtipo === subfiltroActual;
                    return cumpleTipo && cumpleSubtipo;
                });

                // Solo se muestra descripcion-precio si está seleccionado exclusivamente el tipo principal (no 'todos', y subtipo es 'todos')
                const infoTipo = infoData.find(i => i.tipo && i.tipo === filtroActual);
                const textoPrecio = (filtroActual !== 'todos' && subfiltroActual === 'todos' && infoTipo && infoTipo['descripcion-precio'])
                    ? infoTipo['descripcion-precio']
                    : null;
                const tienePrecio = textoPrecio && (typeof textoPrecio === 'string' ? textoPrecio.trim() !== '' : (Array.isArray(textoPrecio) ? textoPrecio.length > 0 : false));

                const columnas = getColumnasGaleria();
                const indicePrecio = tienePrecio ? Math.min(columnas * 3, filtradas.length) : -1;

                filtradas.forEach((obra, index) => {
                    if (tienePrecio && index === indicePrecio) {
                        contenedor.appendChild(crearBloqueDescripcionPrecio(textoPrecio));
                    }

                    const obraElement = document.createElement('div');
                    obraElement.className = 'group cursor-pointer w-full';
                    
                    const etiquetaVenta = '';

                    obraElement.innerHTML = `
                        <div class="overflow-hidden bg-neutral-100 aspect-[4/5] relative rounded-sm">
                            <img src="${rutaMiniatura(obra.imagen)}" data-original="${obra.imagen}" alt="${obra.titulo}" loading="lazy" decoding="async" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105">
                            ${etiquetaVenta}
                        </div>
                    `;
                    obraElement.addEventListener('click', () => abrirModal(obra));
                    contenedor.appendChild(obraElement);
                });

                if (tienePrecio && indicePrecio === filtradas.length) {
                    contenedor.appendChild(crearBloqueDescripcionPrecio(textoPrecio));
                }
                
                renderizarInfoSubtipos();
            }

            let ultimasColumnas = getColumnasGaleria();
            window.addEventListener('resize', () => {
                const cols = getColumnasGaleria();
                if (cols !== ultimasColumnas) {
                    ultimasColumnas = cols;
                    aplicarFiltro();
                }
            });

            Promise.all([
                fetch('obras.json').then(res => res.json()),
                fetch('info.json').then(res => res.json())
            ]).then(([obras, info]) => {
                obrasData = obras;
                infoData = info;
                renderizarFiltrosPrincipales(); 
                renderizerSubfiltros();
                aplicarFiltro();
                
                document.body.classList.remove('opacity-0');
            }).catch(err => console.error("Error cargando los datos de la galería:", err));

            modalCerrar.addEventListener('click', cerrarModal);
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal || e.target.id === 'modal-area-deslizable') cerrarModal();
            });
            
            document.addEventListener('keydown', (e) => {
                if (!modal.classList.contains('hidden')) {
                    if (e.key === 'Escape') cerrarModal();
                    if (e.key === 'ArrowLeft') cambiarImagenModal(-1);
                    if (e.key === 'ArrowRight') cambiarImagenModal(1);
                }
            });
        });
    </script>
</body>
</html>
