<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén | Herminia López</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
        .font-serif { font-family: 'Playfair Display', serif; }
        .font-sans { font-family: 'Inter', sans-serif; }
        
        .titulo-fluido {
            font-size: clamp(1.75rem, 4vw, 3rem);
        }
    </style>
</head>
<body class="opacity-0 transition-opacity duration-500 ease-in-out bg-[#fafafa] text-[#1c1c1c] font-sans antialiased flex flex-col min-h-screen text-base">

    <div id="nav-placeholder"></div>

    <main class="flex-grow max-w-6xl mx-auto px-4 sm:px-6 py-8 md:py-12 w-full">
        <h2 class="font-serif titulo-fluido font-normal mb-8 text-center">Textillo para vender</h2>
        
        <!-- Contenedor para los filtros (tipo-venta) -->
        <div id="filtros-contenedor" class="flex flex-wrap justify-center gap-x-6 gap-y-2 text-xs sm:text-sm font-medium tracking-wide uppercase text-neutral-500 mb-8 md:mb-12"></div>

        <div id="almacen-contenedor" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8"></div>
    </main>

    <div id="footer-placeholder" class="mt-auto"></div>

    <!-- Modal copiado de la galería -->
    <div id="modal-obra" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center hidden" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <button id="modal-cerrar" class="absolute top-4 right-4 sm:top-6 sm:right-6 text-white/80 hover:text-white text-3xl sm:text-4xl font-light leading-none transition-colors z-50" aria-label="Cerrar vista completa">&times;</button>
        
        <button id="modal-prev" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 text-white/50 hover:text-white text-5xl sm:text-7xl font-light transition-colors z-50 hidden select-none" aria-label="Imagen anterior">&lsaquo;</button>
        <button id="modal-next" class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 text-white/50 hover:text-white text-5xl sm:text-7xl font-light transition-colors z-50 hidden select-none" aria-label="Siguiente imagen">&rsaquo;</button>

        <div class="relative max-w-4xl max-h-[95vh] w-full px-4 flex flex-col items-center justify-center overflow-y-auto py-6" id="modal-area-deslizable">
            
            <!-- CONTENEDOR CARRUSEL DE IMÁGENES -->
            <div id="slider-contenedor" class="w-full h-[50vh] sm:h-[60vh] overflow-hidden relative touch-pan-y">
                <!-- TRACK donde se pondrán todas las fotos lado a lado -->
                <div id="slider-track" class="flex w-full h-full items-center transition-transform duration-300">
                    <!-- Las imágenes se insertan aquí vía JS -->
                </div>
            </div>
            
            <div id="modal-miniaturas" class="flex gap-2 sm:gap-3 mt-4 sm:mt-6 overflow-x-auto max-w-full pb-2 scrollbar-none"></div>

            <div id="modal-info" class="text-center text-white mt-4 max-w-xl px-2 flex flex-col items-center">
                <h3 id="modal-titulo" class="font-serif text-xl sm:text-2xl font-medium"></h3>
                <p id="modal-detalles" class="text-xs sm:text-sm text-neutral-300 mt-1"></p>
                
                <a id="modal-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 mt-4 text-xs sm:text-sm font-medium text-white hover:text-[#25D366] bg-white/10 hover:bg-white/20 px-5 py-2 rounded-full transition-all duration-300 border border-white/20 hover:border-[#25D366]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                    </svg>
                    Comprar / Solicitar información
                </a>
            </div>
            
        </div>
    </div>

    <script src="componentes.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contenedor = document.getElementById('almacen-contenedor');
            const modal = document.getElementById('modal-obra');
            
            const sliderContenedor = document.getElementById('slider-contenedor');
            const sliderTrack = document.getElementById('slider-track');
            
            const modalTitulo = document.getElementById('modal-titulo');
            const modalDetalles = document.getElementById('modal-detalles');
            const modalCerrar = document.getElementById('modal-cerrar');
            const modalMiniaturas = document.getElementById('modal-miniaturas');
            const modalWhatsapp = document.getElementById('modal-whatsapp');
            
            const btnPrev = document.getElementById('modal-prev');
            const btnNext = document.getElementById('modal-next');

            let obrasData = [];
            let filtroActual = 'todos';

            // Variables de estado para el carrusel y arrastre
            let imagenesModalActuales = [];
            let indiceModalActual = 0;
            let isDragging = false;
            let startX = 0;
            let currentX = 0;

            function actualizarMiniaturas() {
                Array.from(modalMiniaturas.children).forEach((thumb, index) => {
                    if (index === indiceModalActual) {
                        thumb.classList.remove('border-transparent', 'opacity-50', 'hover:opacity-100');
                        thumb.classList.add('border-white', 'opacity-100');
                    } else {
                        thumb.classList.add('border-transparent', 'opacity-50', 'hover:opacity-100');
                        thumb.classList.remove('border-white', 'opacity-100');
                    }
                });
            }

            function actualizarVistaModal() {
                sliderTrack.style.transition = 'transform 0.3s ease-out';
                sliderTrack.style.transform = `translateX(-${indiceModalActual * 100}%)`;
                actualizarMiniaturas();
            }

            function cambiarImagenModal(direccion) {
                if (imagenesModalActuales.length <= 1) return;
                
                indiceModalActual += direccion;
                
                if (indiceModalActual >= imagenesModalActuales.length) indiceModalActual = 0;
                if (indiceModalActual < 0) indiceModalActual = imagenesModalActuales.length - 1;
                
                actualizarVistaModal();
            }

            function abrirModal(obra) {
                imagenesModalActuales = [obra.imagen];
                if (obra.imagenes && obra.imagenes.length > 0) {
                    imagenesModalActuales.push(...obra.imagenes);
                }
                indiceModalActual = 0;

                modalTitulo.textContent = obra.titulo;
                
                // Mantenemos el nombre de la técnica o subtítulo seguido del precio
                const textoDescriptivo = obra.subtitulo || obra.tecnica || '';
                modalDetalles.textContent = textoDescriptivo ? `${textoDescriptivo} — ${obra.precio}€` : `${obra.precio}€`;
                
                const numeroWhatsApp = "34644241265";
                const mensaje = encodeURIComponent(`¡Hola! Me gustaría comprar / pedir información sobre "${obra.titulo}".`);
                modalWhatsapp.href = `https://wa.me/${numeroWhatsApp}?text=${mensaje}`;

                sliderTrack.innerHTML = '';
                
                imagenesModalActuales.forEach((imgSrc) => {
                    const slideWrapper = document.createElement('div');
                    slideWrapper.className = 'w-full h-full flex-shrink-0 px-2 sm:px-6 flex items-center justify-center';
                    
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.alt = obra.titulo;
                    img.className = 'max-w-full max-h-full object-contain select-none pointer-events-none';
                    
                    slideWrapper.appendChild(img);
                    sliderTrack.appendChild(slideWrapper);
                });

                modalMiniaturas.innerHTML = '';

                if (imagenesModalActuales.length > 1) {
                    btnPrev.classList.remove('hidden');
                    btnNext.classList.remove('hidden');
                } else {
                    btnPrev.classList.add('hidden');
                    btnNext.classList.add('hidden');
                }

                if (imagenesModalActuales.length > 1) {
                    imagenesModalActuales.forEach((imgSrc, index) => {
                        const thumb = document.createElement('img');
                        thumb.src = imgSrc;
                        thumb.alt = `Vista ${index + 1} de ${obra.titulo}`;
                        thumb.className = 'w-12 h-12 sm:w-16 sm:h-16 flex-shrink-0 object-cover cursor-pointer border-2 transition-all duration-200';
                        
                        thumb.addEventListener('click', () => {
                            indiceModalActual = index;
                            actualizarVistaModal();
                        });

                        modalMiniaturas.appendChild(thumb);
                    });
                }

                sliderTrack.style.transition = 'none';
                sliderTrack.style.transform = `translateX(0%)`;
                actualizarMiniaturas();

                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }

            function cerrarModal() {
                modal.classList.add('hidden');
                sliderTrack.innerHTML = '';
                modalMiniaturas.innerHTML = '';
                document.body.style.overflow = '';
            }

            btnPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                cambiarImagenModal(-1);
            });
            btnNext.addEventListener('click', (e) => {
                e.stopPropagation();
                cambiarImagenModal(1);
            });

            // Funciones de arrastre táctil copiadas de la galería
            function iniciarArrastre(e) {
                if (imagenesModalActuales.length <= 1) return;
                isDragging = true;
                startX = e.touches[0].clientX;
                sliderTrack.style.transition = 'none'; 
            }

            function arrastrar(e) {
                if (!isDragging) return;
                e.preventDefault(); 
                currentX = e.touches[0].clientX - startX;
                
                if (indiceModalActual === 0 && currentX > 0) {
                    currentX = currentX * 0.3;
                } else if (indiceModalActual === imagenesModalActuales.length - 1 && currentX < 0) {
                    currentX = currentX * 0.3;
                }

                sliderTrack.style.transform = `translateX(calc(-${indiceModalActual * 100}% + ${currentX}px))`;
            }

            function finalizarArrastre() {
                if (!isDragging) return;
                isDragging = false;

                const umbralCambio = window.innerWidth * 0.15; 

                if (currentX <= -umbralCambio && indiceModalActual < imagenesModalActuales.length - 1) {
                    cambiarImagenModal(1); 
                } else if (currentX >= umbralCambio && indiceModalActual > 0) {
                    cambiarImagenModal(-1);
                } else {
                    actualizarVistaModal(); 
                }
                currentX = 0;
            }

            sliderContenedor.addEventListener('touchstart', iniciarArrastre, { passive: true });
            sliderContenedor.addEventListener('touchmove', arrastrar, { passive: false });
            sliderContenedor.addEventListener('touchend', finalizarArrastre);

            // Logica de filtros aplicados únicamente al atributo "tipo-venta"
            function renderizarFiltrosPrincipales() {
                const contenedorFiltros = document.getElementById('filtros-contenedor');
                contenedorFiltros.innerHTML = '';

                // Obtenemos los valores únicos de "tipo-venta" ignorando vacíos o nulos
                const tiposVentaUnicos = [...new Set(obrasData.map(o => o['tipo-venta']).filter(Boolean))];

                const btnTodos = document.createElement('button');
                btnTodos.textContent = 'Mostrar todos';
                btnTodos.className = `bg-transparent hover:text-[#4b262a] transition-colors py-1 ${filtroActual === 'todos' ? 'text-black font-semibold' : ''}`;
                btnTodos.addEventListener('click', () => {
                    filtroActual = 'todos';
                    renderizarFiltrosPrincipales(); 
                    aplicarFiltro();
                });
                contenedorFiltros.appendChild(btnTodos);

                tiposVentaUnicos.forEach(tipo => {
                    const btn = document.createElement('button');
                    btn.textContent = tipo.charAt(0).toUpperCase() + tipo.slice(1);
                    btn.className = `bg-transparent hover:text-[#4b262a] transition-colors py-1 ${filtroActual === tipo ? 'text-black font-semibold' : ''}`;
                    
                    btn.addEventListener('click', () => {
                        filtroActual = tipo;
                        renderizarFiltrosPrincipales(); 
                        aplicarFiltro();
                    });
                    
                    contenedorFiltros.appendChild(btn);
                });
            }

            function aplicarFiltro() {
                contenedor.innerHTML = '';
                
                const filtradas = obrasData.filter(o => {
                    return filtroActual === 'todos' || o['tipo-venta'] === filtroActual;
                });

                filtradas.forEach(obra => {
                    const obraElement = document.createElement('div');
                    obraElement.className = 'group cursor-pointer w-full';
                    
                    // Mostramos la imagen de la obra, el título y el precio tal y como estaba antes
                    obraElement.innerHTML = `
                        <div class="overflow-hidden bg-neutral-100 aspect-[4/5] relative mb-3 rounded-sm">
                            <img src="${obra.imagen}" alt="${obra.titulo}" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105">
                        </div>
                        <h3 class="font-serif text-base sm:text-lg font-medium text-neutral-800">${obra.titulo}</h3>
                        <p class="text-[10px] sm:text-xs text-neutral-400 uppercase tracking-wider mt-0.5">${obra.precio}€</p>
                    `;
                    obraElement.addEventListener('click', () => abrirModal(obra));
                    contenedor.appendChild(obraElement);
                });
            }

            // Petición inicial para rellenar los datos filtrando únicamente los del almacén
            fetch('obras.json')
                .then(res => res.json())
                .then(obras => {
                    obrasData = obras.filter(obra => obra.almacen === 1);
                    renderizarFiltrosPrincipales();
                    aplicarFiltro();
                    document.body.classList.remove('opacity-0');
                }).catch(err => console.error("Error al cargar almacén:", err));

            // Eventos del modal
            modalCerrar.addEventListener('click', cerrarModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal || e.target.id === 'modal-area-deslizable') cerrarModal();
            });
            document.addEventListener('keydown', (e) => {
                if (!modal.classList.contains('hidden')) {
                    if (e.key === 'Escape') cerrarModal();
                    if (e.key === 'ArrowLeft') cambiarImagenModal(-1);
                    if (e.key === 'ArrowRight') cambiarImagenModal(1);
                }
            });
        });
    </script>
</body>
</html>
